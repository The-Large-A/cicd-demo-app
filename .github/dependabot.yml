# Weekly pull requests for outdated dependencies. Jenkins builds and tests each one
# like any other pull request; nothing is deployed until a human merges it.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
