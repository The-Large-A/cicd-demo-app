# Weekly pull requests for outdated dependencies. Jenkins builds and tests each one
# like any other pull request; nothing is deployed until a human merges it.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Stay on Java 21 (LTS): accept patch updates of the base image, not Java 22/23/24...
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
