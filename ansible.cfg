# Ansible settings, picked up automatically when ansible-playbook runs from the repo root
[defaults]
inventory = ansible/inventory.ini
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
# Trust the VM's host key on first connect, then refuse if it ever changes
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
