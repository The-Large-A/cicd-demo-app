# jenkins: the Azure VM that runs Jenkins. Its IP comes from azure/setup.sh
#          (-e @$HOME/cicd-outputs/ansible-vars.yml), so nothing here needs editing.
[jenkins]
jenkins-vm ansible_host="{{ jenkins_vm_ip }}" ansible_user=azureuser

# local: the machine running the playbook. deploy.yml runs here (on the Jenkins VM)
#        and talks to AKS through the Kubernetes API.
[local]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"
